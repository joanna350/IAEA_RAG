# Template only — do not commit real secret values to git.
#
# Create the actual secret imperatively instead:
#   kubectl create secret generic groq-api-key \
#     --namespace iaea-rag \
#     --from-literal=GROQ_API_KEY=sk-...
#
# (Secret data is base64-encoded, not encrypted — this is obfuscation, not
